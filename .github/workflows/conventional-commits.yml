name: Conventional Commits

# The repo is squash-only under pipeline v2, so the PR title becomes the squash
# commit subject — and that subject is what the deploy changelog shows for a
# release. This validates the title is a valid Conventional Commit so a bad
# title can't slip into that history. There is no Release Please here; v2
# versions releases by `release-*` image tag, so the type does not drive a
# version bump — it drives readability.
#
# Scope is optional (both `fix:` and `fix(chunking):` are accepted). `deps`,
# `ci`, and `docker` are allowed so Dependabot's conventional-commit prefixes
# (.github/dependabot.yml) pass this check; without them a Dependabot PR titled
# with one of those prefixes would fail and auto-merge would never fire.
#
# The job NAME ("Validate PR Title") is the status-check context required by the
# default-branch ruleset. Renaming it un-gates the branch.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            build
            deps
            docker
            perf
            refactor
            revert
            style
            test
